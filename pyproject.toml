[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cauchylift"
version = "1.0.0"
description = "CauchyLift: Curvature-Adaptive Matrix Optimizer with Historical Momentum and Decoupled Weight Decay"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
    {name = "Tasmai Keni", email = "tas.ken.rt25@dypatil.edu"}
]
keywords = ["deep-learning", "optimizer", "transformer", "rocm", "pytorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rocm: requires a PyTorch ROCm build and an available AMD GPU",
  "stress: repeated-step, dynamic-range, and memory tests",
]
